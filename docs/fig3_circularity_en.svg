<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="470" height="175" viewBox="0 0 470 175" font-family="Helvetica,Arial,sans-serif">
<text x="0" y="12" font-size="10" fill="#1a1a1c" text-anchor="start" font-weight="bold">Figure 3. Three kinds of circularity, each tracked separately</text>
<rect x="0" y="26" width="148" height="120" rx="5" fill="#dbe8fc" stroke="#2663eb" stroke-width="1.2"/>
<circle cx="20" cy="46" r="7" fill="#2663eb" stroke="none" stroke-width="1"/>
<text x="34" y="44" font-size="9" fill="#2663eb" text-anchor="start" font-weight="bold">Discovery</text>
<text x="11" y="76" font-size="8" fill="#1a1a1c" text-anchor="start">Was a predictor used to find the</text>
<text x="11" y="86.5" font-size="8" fill="#1a1a1c" text-anchor="start">region in the first place? If a</text>
<text x="11" y="97" font-size="8" fill="#1a1a1c" text-anchor="start">predicted segment was deleted</text>
<text x="11" y="107.5" font-size="8" fill="#1a1a1c" text-anchor="start">and the deletion worked, that</text>
<text x="11" y="118" font-size="8" fill="#1a1a1c" text-anchor="start">region cannot test that predictor.</text>
<rect x="158" y="26" width="148" height="120" rx="5" fill="#fcedd6" stroke="#b5540a" stroke-width="1.2"/>
<circle cx="178" cy="46" r="7" fill="#b5540a" stroke="none" stroke-width="1"/>
<text x="192" y="44" font-size="9" fill="#b5540a" text-anchor="start" font-weight="bold">Agreement</text>
<text x="169" y="76" font-size="8" fill="#1a1a1c" text-anchor="start">Do experiment and prediction</text>
<text x="169" y="86.5" font-size="8" fill="#1a1a1c" text-anchor="start">already agree? Regions that are</text>
<text x="169" y="97" font-size="8" fill="#1a1a1c" text-anchor="start">easy to map are often the classic</text>
<text x="169" y="107.5" font-size="8" fill="#1a1a1c" text-anchor="start">motifs predictors were built to find.</text>
<text x="169" y="118" font-size="8" fill="#1a1a1c" text-anchor="start">Those cannot separate good tools</text>
<text x="169" y="128.5" font-size="8" fill="#1a1a1c" text-anchor="start">from bad.</text>
<rect x="316" y="26" width="148" height="120" rx="5" fill="#fce6e6" stroke="#ba121c" stroke-width="1.2"/>
<circle cx="336" cy="46" r="7" fill="#ba121c" stroke="none" stroke-width="1"/>
<text x="350" y="44" font-size="9" fill="#ba121c" text-anchor="start" font-weight="bold">Training set</text>
<text x="327" y="76" font-size="8" fill="#1a1a1c" text-anchor="start">Is the protein in the database the</text>
<text x="327" y="86.5" font-size="8" fill="#1a1a1c" text-anchor="start">modern tool was trained on? If so,</text>
<text x="327" y="97" font-size="8" fill="#1a1a1c" text-anchor="start">a hit may be memory rather than</text>
<text x="327" y="107.5" font-size="8" fill="#1a1a1c" text-anchor="start">prediction.</text>
</svg>