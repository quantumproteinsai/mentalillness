<text x="56" y="119" font-size="7.5" fill="#6b707a" text-anchor="end">it)</text>
<text x="0" y="222" font-size="8" fill="#6b707a" text-anchor="start">The same seven proteins and the same seven v values in both panels. Only the horizontal axis changes. On the left, how polar the</text>
<text x="0" y="232.5" font-size="8" fill="#6b707a" text-anchor="start">buried core of the solved fibril is - which took 22 downloaded structures and a geometry calculation. On the right, how polar the</text>
<text x="0" y="243" font-size="8" fill="#6b707a" text-anchor="start">sequence of the region is - which you can count off the letters by hand. THE CHEAP ONE FITS BETTER. So the finding was never</text>
<text x="0" y="253.5" font-size="8" fill="#6b707a" text-anchor="start">about structure; it was about composition, and that was already published in 2020 by someone else, on far more data.</text>
