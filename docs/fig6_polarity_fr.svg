<text x="0" y="222" font-size="8" fill="#6b707a" text-anchor="start">Les mêmes sept protéines et les mêmes sept valeurs de v dans les deux panneaux : seul l'axe horizontal change. À gauche, la</text>
<text x="0" y="232.5" font-size="8" fill="#6b707a" text-anchor="start">polarité du coeur enfoui de la fibrille résolue - 22 structures téléchargées et un calcul de géométrie. À droite, la polarité de la</text>
<text x="0" y="243" font-size="8" fill="#6b707a" text-anchor="start">séquence de la région - que l'on peut compter à la main sur les lettres. LA MESURE GRATUITE COLLE MIEUX. Le résultat ne</text>
<text x="0" y="253.5" font-size="8" fill="#6b707a" text-anchor="start">portait donc pas sur la structure mais sur la composition, et cela avait déjà été publié en 2020 par d'autres, sur bien plus de</text>
<text x="0" y="264" font-size="8" fill="#6b707a" text-anchor="start">données.</text>
