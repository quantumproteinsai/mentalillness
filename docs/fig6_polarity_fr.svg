<text x="0" y="226" font-size="8" fill="#6b707a" text-anchor="start">Chaque point est une protéine dont la structure de la fibrille est résolue : son coeur peut donc être mesuré et non supposé. Plus le</text>
<text x="0" y="236.5" font-size="8" fill="#6b707a" text-anchor="start">coeur est polaire, moins le prédicteur réussit. Données réelles ; la statistique a été fixée avant d'être calculée.</text>
